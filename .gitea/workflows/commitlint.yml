name: Commitlint

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'
  COMMITLINT_VERSION: '19'
  COMMITLINT_CACHE_PREFIX: commitlint-tools-v1

jobs:
  commitlint:
    runs-on: linux
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm + commitlint tools cache
        id: commitlint-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            ~/.cache/bramble-go/commitlint-tools
          key: ${{ runner.os }}-${{ env.COMMITLINT_CACHE_PREFIX }}-node${{ env.NODE_VERSION }}-cli${{ env.COMMITLINT_VERSION }}-${{ hashFiles('.gitea/workflows/commitlint.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.COMMITLINT_CACHE_PREFIX }}-node${{ env.NODE_VERSION }}-cli${{ env.COMMITLINT_VERSION }}-
            ${{ runner.os }}-${{ env.COMMITLINT_CACHE_PREFIX }}-node${{ env.NODE_VERSION }}-

      - name: Install commitlint
        run: |
          set -euo pipefail
          TOOLS_DIR="$HOME/.cache/bramble-go/commitlint-tools"
          mkdir -p "$TOOLS_DIR"
          npm install --prefix "$TOOLS_DIR" --no-save \
            "@commitlint/cli@${COMMITLINT_VERSION}" \
            "@commitlint/config-conventional@${COMMITLINT_VERSION}"

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cache/bramble-go/commitlint-tools/node_modules/.bin:$PATH"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            commitlint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            commitlint --last --verbose
          else
            commitlint --from "$PUSH_BEFORE_SHA" --to "$PUSH_SHA" --verbose
          fi

      - name: Save npm + commitlint tools cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.npm
            ~/.cache/bramble-go/commitlint-tools
          key: ${{ steps.commitlint-cache-restore.outputs.cache-primary-key }}
