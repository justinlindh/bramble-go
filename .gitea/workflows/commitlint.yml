name: Commitlint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Validate commit messages
        run: |
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ gitea.event.pull_request.base.sha }}" --to "${{ gitea.event.pull_request.head.sha }}" --verbose
          else
            npx commitlint --from "${{ gitea.before }}" --to "${{ gitea.sha }}" --verbose
          fi
