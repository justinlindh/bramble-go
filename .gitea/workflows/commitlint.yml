name: Commitlint

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'
  COMMITLINT_VERSION: '19.6.0'

jobs:
  commitlint:
    runs-on: linux
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install commitlint (pinned, cached on runner)
        run: |
          set -euo pipefail
          TOOLS_DIR="$HOME/.cache/bramble-go/commitlint-tools"
          MARKER="$TOOLS_DIR/.commitlint-version"
          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$TOOLS_DIR/node_modules/.bin/commitlint" ] || \
             [ ! -f "$MARKER" ] || \
             [ "$(cat "$MARKER")" != "${COMMITLINT_VERSION}" ]; then
            rm -rf "$TOOLS_DIR/node_modules"
            npm install --prefix "$TOOLS_DIR" --no-save \
              "@commitlint/cli@${COMMITLINT_VERSION}" \
              "@commitlint/config-conventional@${COMMITLINT_VERSION}"
            echo "${COMMITLINT_VERSION}" > "$MARKER"
          fi

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export TOOLS_DIR="$HOME/.cache/bramble-go/commitlint-tools"
          export PATH="$TOOLS_DIR/node_modules/.bin:$PATH"
          export NODE_PATH="$TOOLS_DIR/node_modules"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            commitlint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            commitlint --last --verbose
          else
            commitlint --from "$PUSH_BEFORE_SHA" --to "$PUSH_SHA" --verbose
          fi
