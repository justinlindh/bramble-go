name: Go Quality

on:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .gitea/workflows/go-quality.yml
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .gitea/workflows/go-quality.yml

env:
  GO_CACHE_PREFIX: go-quality-v1

jobs:
  test:
    name: go test
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-${{ hashFiles('.gitea/workflows/go-quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-

      - name: Run tests
        run: go test ./...

      - name: Save Go caches
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}

  vet:
    name: go vet
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-${{ hashFiles('.gitea/workflows/go-quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-

      - name: Run vet
        run: go vet ./...

      - name: Save Go caches
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}

  lint:
    name: golangci-lint
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go and lint caches
        id: go-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-${{ hashFiles('.gitea/workflows/go-quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          skip-cache: false
          skip-save-cache: false
          args: --timeout=5m

      - name: Save Go and lint caches
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}

  build:
    name: go build
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-${{ hashFiles('.gitea/workflows/go-quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-${{ env.GO_CACHE_PREFIX }}-

      - name: Build all packages
        run: go build ./...

      - name: Save Go caches
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache-restore.outputs.cache-primary-key }}
