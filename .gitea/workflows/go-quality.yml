name: Go Quality

on:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .gitea/workflows/go-quality.yml
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .gitea/workflows/go-quality.yml

env:
  GOMODCACHE: /home/runner/.cache/bramble-go/go/pkg/mod
  GOCACHE: /home/runner/.cache/bramble-go/go-build

jobs:
  test:
    name: go test
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Run tests
        run: go test ./...

  vet:
    name: go vet
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Run vet
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          skip-cache: false
          skip-save-cache: false
          args: --timeout=5m

  build:
    name: go build
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Build all packages
        run: go build ./...
