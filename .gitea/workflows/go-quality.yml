name: Go Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .gitea/workflows/go-quality.yml
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .golangci.yml
      - .gitea/workflows/go-quality.yml

env:
  GOMODCACHE: /home/runner/.cache/bramble-go/go/pkg/mod
  GOCACHE: /home/runner/.cache/bramble-go/go-build

jobs:
  test:
    name: go test
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          GOROOT="/opt/hostedtoolcache/go/${GO_VERSION}/x64"
          if [ ! -x "$GOROOT/bin/go" ]; then
            GOROOT="/tmp/go-sdk"
            mkdir -p "$GOROOT"
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
              | tar -xz -C "$GOROOT" --strip-components=1
          fi
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          "$GOROOT/bin/go" version

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Run tests
        run: go test ./...

  vet:
    name: go vet
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          GOROOT="/opt/hostedtoolcache/go/${GO_VERSION}/x64"
          if [ ! -x "$GOROOT/bin/go" ]; then
            GOROOT="/tmp/go-sdk"
            mkdir -p "$GOROOT"
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
              | tar -xz -C "$GOROOT" --strip-components=1
          fi
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          "$GOROOT/bin/go" version

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Run vet
        run: go vet ./...

      - name: Check go.mod is tidy
        run: go mod tidy -diff

  lint:
    name: golangci-lint
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          GOROOT="/opt/hostedtoolcache/go/${GO_VERSION}/x64"
          if [ ! -x "$GOROOT/bin/go" ]; then
            GOROOT="/tmp/go-sdk"
            mkdir -p "$GOROOT"
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
              | tar -xz -C "$GOROOT" --strip-components=1
          fi
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          "$GOROOT/bin/go" version

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Install golangci-lint (runner-built)
        run: |
          set -euo pipefail
          GOLANGCI_LINT_VERSION=v2.11.4
          GOBIN="$HOME/.cache/bramble-go/go-tools/bin"
          MARKER="$GOBIN/.golangci-lint-version"
          mkdir -p "$GOBIN"
          if [ ! -x "$GOBIN/golangci-lint" ] || \
             [ ! -f "$MARKER" ] || \
             [ "$(cat "$MARKER")" != "$GOLANGCI_LINT_VERSION" ]; then
            GOBIN="$GOBIN" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
            echo "$GOLANGCI_LINT_VERSION" > "$MARKER"
          fi

      - name: Run golangci-lint
        run: |
          "$HOME/.cache/bramble-go/go-tools/bin/golangci-lint" run --timeout=5m

  build:
    name: go build
    runs-on: linux
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          GOROOT="/opt/hostedtoolcache/go/${GO_VERSION}/x64"
          if [ ! -x "$GOROOT/bin/go" ]; then
            GOROOT="/tmp/go-sdk"
            mkdir -p "$GOROOT"
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
              | tar -xz -C "$GOROOT" --strip-components=1
          fi
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          "$GOROOT/bin/go" version

      - name: Prewarm module cache
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go mod download

      - name: Build all packages
        run: go build ./...
