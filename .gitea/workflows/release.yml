name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no tags/releases)
        type: boolean
        required: false
        default: false

env:
  NODE_VERSION: '20'
  SEMREL_VERSION: '24'
  SEMREL_COMMIT_ANALYZER_VERSION: '13'
  SEMREL_NOTES_GENERATOR_VERSION: '14'
  SEMREL_GITEA_VERSION: '2'

jobs:
  semantic-release:
    # Gitea runners in this environment use "linux" labels.
    runs-on: linux
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release prerequisites
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ secrets.GITEA_URL }}
        run: |
          set -euo pipefail

          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "ERROR: Missing required secret GITEA_TOKEN." >&2
            echo "Create a Gitea Actions secret named GITEA_TOKEN with repo write + release permissions." >&2
            exit 1
          fi

          if [ -n "${GITEA_URL:-}" ] && ! echo "$GITEA_URL" | grep -Eq '^https?://'; then
            echo "ERROR: GITEA_URL must be an http(s) base URL (example: https://git.example.com)." >&2
            exit 1
          fi

      - name: Install semantic-release dependencies (pinned, cached on runner)
        run: |
          set -euo pipefail
          TOOLS_DIR="$HOME/.cache/bramble-go/release-tools"
          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$TOOLS_DIR/node_modules/.bin/semantic-release" ]; then
            npm install --prefix "$TOOLS_DIR" --no-save \
              "semantic-release@${SEMREL_VERSION}" \
              "@semantic-release/commit-analyzer@${SEMREL_COMMIT_ANALYZER_VERSION}" \
              "@semantic-release/release-notes-generator@${SEMREL_NOTES_GENERATOR_VERSION}" \
              "@saithodev/semantic-release-gitea@${SEMREL_GITEA_VERSION}"
          fi

      - name: Run semantic-release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ secrets.GITEA_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          dry_flag=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            echo "Running semantic-release in --dry-run mode (manual dispatch input dry_run=true)."
            dry_flag="--dry-run"
          fi

          export TOOLS_DIR="$HOME/.cache/bramble-go/release-tools"
          export PATH="$TOOLS_DIR/node_modules/.bin:$PATH"
          export NODE_PATH="$TOOLS_DIR/node_modules"
          semantic-release $dry_flag
